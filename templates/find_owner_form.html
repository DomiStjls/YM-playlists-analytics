<!DOCTYPE html>
<html>
<head>
    <title>Найти владельца</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Выберите плейлист</h2>
    <form method="post" action="/find_owner_result">
        <select name="playlist_id" class="form-select">
            {% for p in playlists %}
                <option value="{{ p.owner.uid }}:{{ p.kind }}">{{ p.title }}</option>
            {% endfor %}
        </select>
        <button class="btn btn-primary mt-2" type="submit">Найти владельца</button>
    </form>
    <a href="/" class="btn btn-secondary mt-3">Назад</a>
</body>
</html>
