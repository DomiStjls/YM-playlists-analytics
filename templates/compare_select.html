<!DOCTYPE html>
<html>
<head>
    <title>Выбор плейлистов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Выберите по одному плейлисту</h2>
    <form method="post" action="/compare_result">
        <label>Плейлисты {{ user1 }}</label>
        <select name="pl1_id" class="form-select mb-3">
            {% for p in playlists1 %}
                <option value="{{ user1 }}:{{ p.kind }}">{{ p.title }}</option>
            {% endfor %}
        </select>

        <label>Плейлисты {{ user2 }}</label>
        <select name="pl2_id" class="form-select mb-3">
            {% for p in playlists2 %}
                <option value="{{ user2 }}:{{ p.kind }}">{{ p.title }}</option>
            {% endfor %}
        </select>

        <button class="btn btn-success" type="submit">Сравнить</button>
    </form>
    <a href="/" class="btn btn-secondary mt-3">Назад</a>
</body>
</html>
