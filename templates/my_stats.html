<!DOCTYPE html>
<html>
<head>
    <title>Моя статистика</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Моя статистика</h2>
    {% if error %}
        <p class="text-danger">Ошибка: токен не задан или недействителен.</p>
    {% else %}
        <ul>
        {% for track in tracks %}
            <li>{{ track.title }} — {{ track.artists[0].name }}</li>
        {% endfor %}
        </ul>
    {% endif %}
    <a href="/" class="btn btn-secondary mt-3">Назад</a>
</body>
</html>
